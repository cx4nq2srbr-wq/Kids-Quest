<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icon-192.png">
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quest Log Manager</title>
    <style>
        :root {
            --primary: #6366f1;
            --success: #22c55e;
            --danger: #ef4444;
            --bg: #f8fafc;
            --text: #1e293b;
        }

        body { font-family: sans-serif; background: var(--bg); display: flex; justify-content: center; padding: 20px; color: var(--text); }
        .card { background: white; padding: 1.5rem; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 450px; position: relative; }
        
        h1 { text-align: center; color: var(--primary); margin-top: 0; }
        h2 { font-size: 1.2rem; border-bottom: 2px solid #eee; padding-bottom: 5px; }

        .item-row { display: flex; align-items: center; gap: 10px; padding: 12px 0; border-bottom: 1px solid #f1f5f9; }
        .item-row input[type="checkbox"] { transform: scale(1.5); cursor: pointer; }
        .completed { text-decoration: line-through; color: #94a3b8; }

        #editor-overlay { 
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.8); z-index: 100; overflow-y: auto; padding: 20px; box-sizing: border-box;
        }
        .editor-content { background: white; padding: 20px; border-radius: 15px; max-width: 400px; margin: auto; }
        .edit-row { display: flex; gap: 5px; margin-bottom: 8px; align-items: center; }
        input[type="text"] { flex-grow: 1; padding: 8px; border: 1px solid #ccc; border-radius: 5px; }
       
        #reward-section { 
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: white; z-index: 200; padding: 2rem; box-sizing: border-box;
            text-align: center; animation: slideUp 0.5s ease-out;
        }

        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

        .reward-pill { 
            padding: 10px; margin: 5px 0; border: 1px solid #e2e8f0; 
            border-radius: 8px; cursor: pointer; transition: 0.2s; background: white;
        }
        .selected-reward { background: #dcfce7; border-color: var(--success); font-weight: bold; }

        .btn { border: none; padding: 10px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .btn-add { background: var(--primary); color: white; width: 100%; margin-top: 10px; }
        .btn-del { background: var(--danger); color: white; }
        .btn-close { background: #334155; color: white; width: 100%; margin-top: 20px; }
        .btn-back { margin-top: 30px; background: #e2e8f0; color: var(--text); width: 100%; }
        
        .settings-icon { position: absolute; top: 20px; right: 20px; cursor: pointer; font-size: 1.5rem; opacity: 0.6; }
        
.confetti { 
    position: absolute; 
    top: -10px; 
    opacity: 0; 
    animation: fall 3s infinite; 
    pointer-events: none; 
    border-radius: 2px; /* Small squares look better than circles */
}
        @keyframes fall { 0% { transform: translateY(0) rotate(0deg); opacity: 1; } 100% { transform: translateY(100vh) rotate(360deg); opacity: 0; } }

        .move-btns { display: flex; flex-direction: column; gap: 2px; }
        .btn-move { background: #f1f5f9; border: 1px solid #cbd5e1; border-radius: 4px; padding: 2px 8px; font-size: 0.8rem; cursor: pointer; }
    </style>
</head>
<body>

<div class="card">
    <div id="version-tag" style="position: absolute; top: 5px; right: 10px; font-size: 0.6rem; color: #cbd5e1; pointer-events: none;">v1.0.0</div>
    <div class="settings-icon" onclick="openParentGate()">⚙️</div>
    <h1>🚀 Kids Quest</h1>
    <div id="quest-list"></div>
</div>

<div id="reward-section">
    <div style="font-size: 4rem;">🏆</div>
    <h1>Mission Complete!</h1>
    <p>You earned it! Choose a reward:</p>
    <div id="reward-list"></div>
    <button class="btn btn-back" onclick="document.getElementById('reward-section').style.display='none'">Back to Quests</button>
</div>

<div id="editor-overlay">
    <div class="editor-content">
        <h2>Edit Responsibilities</h2>
        <div id="edit-tasks-container"></div>
        <button class="btn btn-add" onclick="addItem('tasks')">+ Add Responsibility</button>

        <h2 style="margin-top:25px">Edit Privileges</h2>
        <div id="edit-rewards-container"></div>
        <button class="btn btn-add" onclick="addItem('rewards')">+ Add Privilege</button>

        <button class="btn btn-close" onclick="closeEditor()">Done & Save</button>
        <button class="btn" style="background: #94a3b8; color: white; width: 100%; margin-top: 10px; font-size: 0.7rem;" onclick="forceUpdate()">Force App Update (Clear Cache)</button>
    </div>
</div>

<div id="parent-gate" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:white; z-index:300; flex-direction:column; align-items:center; justify-content:center; padding:20px; box-sizing:border-box; text-align:center;">
    <h2>Parents Only</h2>
    <p>Please type the numbers below to enter settings:</p>
    <h3 id="code-words" style="letter-spacing: 2px; color: var(--primary); font-size: 1.5rem; margin: 20px 0;"></h3>
    <input type="number" id="gate-input" pattern="\d*" style="font-size: 2rem; width: 150px; text-align: center; padding: 10px; border: 2px solid #cbd5e1; border-radius: 10px; margin-bottom: 20px;">
    <div style="display:flex; gap:10px; width: 100%; max-width: 300px;">
        <button class="btn btn-close" onclick="closeGate()" style="margin:0; flex:1;">Cancel</button>
        <button class="btn btn-add" onclick="verifyGate()" style="margin:0; flex:1;">Enter</button>
    </div>
</div>

<script>

// ONLY ONE displayVersion function!
function displayVersion() {
    const versionTag = document.getElementById('version-tag');
    
    // If the controller isn't ready yet, wait a moment and try again
    if (!navigator.serviceWorker.controller) {
        setTimeout(displayVersion, 500); 
        return;
    }

    const messageChannel = new MessageChannel();
    messageChannel.port1.onmessage = (event) => {
        if (event.data && event.data.type === 'VERSION_INFO') {
            // This cleans up 'quest-log-v1.0.6' into just 'v1.0.6'
            versionTag.innerText = event.data.version.replace('quest-log-', '');
        }
    };

    navigator.serviceWorker.controller.postMessage(
        { type: 'GET_VERSION' },
        [messageChannel.port2]
    );
}

// Update the Registration block at the bottom
if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').then(reg => {
            // Once the SW is active and controlling the page, show version
            navigator.serviceWorker.ready.then(() => {
                displayVersion();
            });

            reg.onupdatefound = () => {
                const worker = reg.installing;
                worker.onstatechange = () => {
                    if (worker.state === 'installed' && navigator.serviceWorker.controller) {
                        window.location.reload();
                    }
                };
            };
        });
    });
}

    let data = JSON.parse(localStorage.getItem('questAppData')) || {
        tasks: ["Pick up clothes", "Read 15 mins"],
        rewards: ["15 min Phone", "Pick the dessert"],
        lastResetDate: new Date().toLocaleDateString(),
        checkedStatus: []
    };

    let currentGateCode = "";
    const numberWords = ["zero", "one", "two", "three", "four", "five", "six", "seven", "eight", "nine"];

    function saveData() {
        localStorage.setItem('questAppData', JSON.stringify(data));
        renderApp();
    }

    function checkMidnightReset() {
        const today = new Date().toLocaleDateString();
        if (data.lastResetDate !== today) {
            data.lastResetDate = today;
            data.checkedStatus = [];
            saveData();
        }
    }

    function renderApp() {
        const questList = document.getElementById('quest-list');
        questList.innerHTML = data.tasks.map((t, i) => {
            const isChecked = data.checkedStatus.includes(t);
            return `
                <div class="item-row ${isChecked ? 'completed' : ''}">
                    <input type="checkbox" id="task-${i}" ${isChecked ? 'checked' : ''} onchange="toggleTask('${t}')">
                    <label for="task-${i}">${t}</label>
                </div>`;
        }).join('');

        const rewardList = document.getElementById('reward-list');
        rewardList.innerHTML = data.rewards.map(r => `
            <div class="reward-pill" onclick="this.classList.toggle('selected-reward')">✨ ${r}</div>`).join('');

        renderEditor();
        updateRewardVisibility();
    }

    function toggleTask(taskName) {
        const index = data.checkedStatus.indexOf(taskName);
        if (index > -1) data.checkedStatus.splice(index, 1);
        else data.checkedStatus.push(taskName);
        saveData();
    }

    function updateRewardVisibility() {
        const totalTasks = data.tasks.length;
        const completedTasks = data.checkedStatus.length;
        const allDone = totalTasks > 0 && completedTasks >= totalTasks;
        const rewardSection = document.getElementById('reward-section');
        
        if (allDone && rewardSection.style.display !== 'block') {
            rewardSection.style.display = 'block';
            spawnConfetti();
        } else if (!allDone) {
            rewardSection.style.display = 'none';
        }
    }

    function spawnConfetti() {
        for (let i = 0; i < 50; i++) {
            const confetti = document.createElement('div');
            confetti.className = 'confetti';
            confetti.style.left = Math.random() * 100 + 'vw';
            confetti.style.width = Math.random() * 10 + 5 + 'px';
            confetti.style.height = confetti.style.width;
            confetti.style.backgroundColor = ['#6366f1', '#22c55e', '#ef4444', '#eab308'][Math.floor(Math.random() * 4)];
            confetti.style.animationDelay = Math.random() * 2 + 's';
            document.getElementById('reward-section').appendChild(confetti);
        }
    }

    // Parental Gate Logic
    // 1. New dedicated function to OPEN the gate
    function openParentGate() {
        const gate = document.getElementById('parent-gate');
        const input = document.getElementById('gate-input');
        input.value = ""; // Clear old input
    
    // Generate 4 random numbers
        let codeArr = [];
        let wordArr = [];
        for(let i=0; i<4; i++) {
            let num = Math.floor(Math.random() * 10);
            codeArr.push(num);
            wordArr.push(numberWords[num]);
        }
    
        currentGateCode = codeArr.join("");
        document.getElementById('code-words').innerText = wordArr.join(" ");
        gate.style.display = 'flex'; // Show the gate
    }

    // 2. Update the verify function
function verifyGate() {
    const input = document.getElementById('gate-input').value;
    if (input === currentGateCode) {
        closeGate();
        document.getElementById('editor-overlay').style.display = 'block'; // Open Editor
    } else {
        alert("Incorrect code. Try again!");
        openParentGate(); // Generate a fresh code on fail
    }
}

function closeGate() {
    document.getElementById('parent-gate').style.display = 'none';
}

function closeEditor() {
    document.getElementById('editor-overlay').style.display = 'none';
}

    // Editor Logic
function renderEditor() {
    const tCont = document.getElementById('edit-tasks-container');
    const rCont = document.getElementById('edit-rewards-container');
    const createEditRow = (type, item, i) => `
        <div class="edit-row">
            <div class="move-btns">
                <button class="btn-move" onclick="moveItem('${type}', ${i}, -1)">▲</button>
                <button class="btn-move" onclick="moveItem('${type}', ${i}, 1)">▼</button>
            </div>
            <input type="text" value="${item}" onchange="updateItem('${type}', ${i}, this.value)">
            <button class="btn btn-del" onclick="removeItem('${type}', ${i})">✕</button>
        </div>`;
    tCont.innerHTML = data.tasks.map((t, i) => createEditRow('tasks', t, i)).join('');
    rCont.innerHTML = data.rewards.map((r, i) => createEditRow('rewards', r, i)).join('');
}

function addItem(type) {
    data[type].push(type === 'tasks' ? "New Responsibility" : "New Privilege");
    saveData();
}

function removeItem(type, index) {
    if (confirm("Delete this item?")) {
        const itemValue = data[type][index];
        data[type].splice(index, 1);
        if (type === 'tasks') data.checkedStatus = data.checkedStatus.filter(v => v !== itemValue);
        saveData();
    }
}

function updateItem(type, index, val) {
    data[type][index] = val;
    saveData();
}

function moveItem(type, index, direction) {
    const newIndex = index + direction;
    if (newIndex < 0 || newIndex >= data[type].length) return;
    [data[type][index], data[type][newIndex]] = [data[type][newIndex], data[type][index]];
    saveData();
}

async function forceUpdate() {
    if (confirm("This will clear all app files and refresh. Your tasks will stay saved. Proceed?")) {
        const cacheNames = await caches.keys();
        await Promise.all(cacheNames.map(name => caches.delete(name)));
        
        // This trick bypasses the GitHub cache by adding a random number to the URL
        window.location.href = window.location.pathname + '?v=' + Date.now();
    }
}

    // Service Worker Registration
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js').then(reg => {
                displayVersion(); // Update version display after SW is ready
                reg.onupdatefound = () => {
                    const worker = reg.installing;
                    worker.onstatechange = () => {
                        if (worker.state === 'installed' && navigator.serviceWorker.controller) {
                            window.location.reload();
                        }
                    };
                };
            });
        });
    }

    checkMidnightReset();
    renderApp();
    displayVersion();
</script>
</body>
</html>
